name: release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to publish (e.g. v1.1.0). Required for manual runs.'
        required: true

permissions:
  contents: write

env:
  GOFLAGS: -trimpath
  CGO_ENABLED: '0'

jobs:
  test:
    name: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: gofmt
        run: |
          unformatted="$(gofmt -l cmd internal pkg)"
          if [ -n "$unformatted" ]; then
            echo "These files are not gofmt-ed:"
            echo "$unformatted"
            exit 1
          fi

      - run: go vet ./...
      - run: go test ./...

  build:
    name: build ${{ matrix.goos }}/${{ matrix.goarch }}
    needs: test
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
          - goos: darwin
            goarch: amd64
          - goos: darwin
            goarch: arm64
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          mkdir -p dist
          go build -ldflags="-s -w" \
            -o "dist/wppserver-${GOOS}-${GOARCH}" ./cmd

      - name: Checksum
        working-directory: dist
        run: shasum -a 256 "wppserver-${{ matrix.goos }}-${{ matrix.goarch }}" \
          > "wppserver-${{ matrix.goos }}-${{ matrix.goarch }}.sha256"

      - uses: actions/upload-artifact@v4
        with:
          name: wppserver-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/*
          if-no-files-found: error
          retention-days: 7

  publish:
    name: publish release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Combine checksums
        working-directory: dist
        run: cat ./*.sha256 > SHA256SUMS && rm ./*.sha256

      - name: Show artifacts
        run: ls -lh dist

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            dist/wppserver-*
            dist/SHA256SUMS
